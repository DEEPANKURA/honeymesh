services:
  honeymesh:
    build:
      context: ..
      dockerfile: lab/Dockerfile
    container_name: honeymesh
    ports:
      - "8000:8000"     # REST API + dashboard
      - "2222:2222"     # HoneySSH decoy
      - "8081:8081"     # HoneyWeb decoy
      - "9000:9000"     # network telemetry listener
    environment:
      HONEYMESH_ENVIRONMENT__MODE: lab
      HONEYMESH_DECEPTION__ADAPTIVE_MODE: "true"
      HONEYMESH_AUTH__ADMIN_USERNAME: admin
      HONEYMESH_AUTH__ADMIN_PASSWORD: ${HONEYMESH_ADMIN_PASSWORD:-lab-admin-pass}
      HONEYMESH_INGEST__TOKEN: ${HONEYMESH_INGEST_TOKEN:-}
      HONEYMESH_DATABASE__URL: sqlite+aiosqlite:///./data/honeymesh.db
    volumes:
      - honeymesh-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/overview', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  attacker:
    image: python:3.12-slim
    container_name: honeymesh-attacker
    depends_on:
      honeymesh:
        condition: service_healthy
    working_dir: /work
    volumes:
      - ../scripts:/work/scripts:ro
    entrypoint: ["python", "/work/scripts/attack_simulator.py"]
    environment:
      # reaches the honeymesh service over the compose network
      BASE_URL_OVERRIDE: "http://honeymesh:8000"
    command:
      - "--scenario"
      - "full"
      - "--ip"
      - "10.30.0.44"
      - "--count"
      - "40"
      - "--base-url"
      - "http://honeymesh:8000"
    profiles: ["attack"]

volumes:
  honeymesh-data:
